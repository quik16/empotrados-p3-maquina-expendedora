<text x="60" y="665" font-family="DejaVu Sans" font-size="13" text-anchor="start" fill="#333">R = resistencia en serie (220-330 ohm). Las lineas de color son hilos de senal; VCC y GND se conectan a los carriles de 5V y GND de la protoboard.</text>
<text x="60" y="687" font-family="DejaVu Sans" font-size="13" text-anchor="start" fill="#333">Interrupciones: D2 (boton, INT0) y D3 (ECHO, INT1), ambas por flanco CHANGE. Watchdog de 1 s.</text>
